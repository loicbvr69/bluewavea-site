ARGUMENTS ===== -->\n  <section style=\"padding: 104px 32px; background: #F6F7F9\">\n    <div style=\"max-width: 1240px; margin: 0 auto\">\n      <div class=\"bw-r1 bw-p1\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 48px; align-items: stretch\">\n        <div style=\"min-width: 0; display: flex; flex-direction: column\">\n          <div style=\"background: #14265C; color: #ffffff; border-radius: 18px; padding: 26px 28px; display: flex; gap: 18px; align-items: center; flex: 1\"><span style=\"width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; font-size: 24px; flex-shrink: 0\">💧<\/span><div style=\"min-width: 0\"><div style=\"font-size: 12.5px; font-weight: 900; letter-spacing: 1.2px; color: #9CC8EC\">POURQUOI ADOUCIR ?<\/div><h2 class=\"bw-h2\" style=\"font-family: 'Playfair Display', serif; font-size: 36px; line-height: 1.12; font-weight: 700; margin: 8px 0 0; letter-spacing: -.4px; color: #ffffff; text-wrap: balance\">Le calcaire ne prévient pas. Il facture.<\/h2><p style=\"font-size: 16px; line-height: 1.65; color: #C6D7E8; margin: 12px 0 0; text-wrap: pretty\">Une eau à 30 °F entartre un ballon d'eau chaude en quelques années, use les résistances, bouche les mousseurs et abîme le linge. L'adoucisseur ne masque pas le problème : il le supprime à la source.<\/p><\/div><\/div>\n          <div style=\"margin-top: 24px; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; flex-shrink: 0; box-shadow: 0 22px 50px rgba(0,19,49,.14)\">\n            <img src=\"img/mains-eau.jpg\" alt=\"Mains en coupe sous l'eau\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center 62%; display: block\">\n          <\/div>\n        <\/div>\n        <div class=\"bw-r2 bw-p0\" style=\"min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 18px; align-items: stretch\">\n          <div style=\"background: #ffffff; border: 1px solid #E3ECF5; border-radius: 16px; padding: 24px; box-shadow: 0 6px 18px rgba(20,38,92,.05)\" style-hover=\"border: 1px solid #9CC8EC; box-shadow: 0 10px 26px rgba(20,38,92,.10)\">\n            <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #FDEBE9; color: #14265C; display: grid; place-items: center; font-size: 21px\">🔥<\/span>\n            <div style=\"font-size: 16.5px; font-weight: 800; color: #14265C; margin-top: 16px\">Jusqu'à 30 % d'énergie<\/div>\n            <p style=\"font-size: 14.5px; line-height: 1.6; color: #4E687F; margin: 8px 0 0\">3 mm de tartre sur une résistance, et votre ballon chauffe pour rien. L'eau douce lui rend son rendement.<\/p>\n          <\/div>\n          <div style=\"background: #ffffff; border: 1px solid #E3ECF5; border-radius: 16px; padding: 24px; box-shadow: 0 6px 18px rgba(20,38,92,.05)\" style-hover=\"border: 1px solid #9CC8EC; box-shadow: 0 10px 26px rgba(20,38,92,.10)\">\n            <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #E2F5EA; color: #14265C; display: grid; place-items: center; font-size: 21px\">🧴<\/span>\n            <div style=\"font-size: 16.5px; font-weight: 800; color: #14265C; margin-top: 16px\">Moitié moins de lessive<\/div>\n            <p style=\"font-size: 14.5px; line-height: 1.6; color: #4E687F; margin: 8px 0 0\">Les détergents moussent enfin. Linge plus souple, vaisselle sans trace, savon divisé par deux.<\/p>\n          <\/div>\n          <div style=\"background: #ffffff; border: 1px solid #E3ECF5; border-radius: 16px; padding: 24px; box-shadow: 0 6px 18px rgba(20,38,92,.05)\" style-hover=\"border: 1px solid #9CC8EC; box-shadow: 0 10px 26px rgba(20,38,92,.10)\">\n            <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #DCEBFA; color: #14265C; display: grid; place-items: center; font-size: 21px\">🚿<\/span>\n            <div style=\"font-size: 16.5px; font-weight: 800; color: #14265C; margin-top: 16px\">Peau et cheveux apaisés<\/div>\n            <p style=\"font-size: 14.5px; line-height: 1.6; color: #4E687F; margin: 8px 0 0\">Fini le film calcaire qui tire sur la peau après la douche. C'est le premier changement que remarquent mes clients.<\/p>\n          <\/div>\n          <div style=\"background: #ffffff; border: 1px solid #E3ECF5; border-radius: 16px; padding: 24px; box-shadow: 0 6px 18px rgba(20,38,92,.05)\" style-hover=\"border: 1px solid #9CC8EC; box-shadow: 0 10px 26px rgba(20,38,92,.10)\">\n            <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #FBF1DD; color: #14265C; display: grid; place-items: center; font-size: 21px\">🛠️<\/span>\n            <div style=\"font-size: 16.5px; font-weight: 800; color: #14265C; margin-top: 16px\">Appareils qui durent<\/div>\n            <p style=\"font-size: 14.5px; line-height: 1.6; color: #4E687F; margin: 8px 0 0\">Lave-linge, chaudière, robinetterie, machine à café : le tartre est leur première cause de panne.<\/p>\n          <\/div>\n          <div style=\"grid-column: span 2; background: #EDF6FE; border: 1px solid #9CC8EC; color: #14265C; border-radius: 16px; padding: 26px 28px; display: flex; gap: 20px; align-items: center\">\n            <span style=\"width: 58px; height: 58px; border-radius: 50%; background: #ffffff; display: grid; place-items: center; flex-shrink: 0; font-size: 28px; animation: bwDrop 3.4s ease-in-out infinite\">💧<\/span>\n            <div style=\"min-width: 0\">\n              <div style=\"font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700\">Je mesure votre eau avant de vous vendre quoi que ce soit.<\/div>\n              <p style=\"font-size: 14.5px; line-height: 1.6; color: #45607B; margin: 7px 0 0\">Dureté à l'entrée, à la sortie, volume, temps de régénération : tout est relevé, chiffré et consigné dans votre compte rendu. Si vous n'avez pas besoin d'un adoucisseur, je vous le dis.<\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <\/sc-if>\n\n  <!-- ===== PAGE SERVICES — titre à gauche, filet vertical bleu ===== -->\n  <sc-if value=\"{{ pServices }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"background: #14265C; color: #fff; padding: 84px 32px 58px; text-align: center\">\n    <div style=\"max-width: 1240px; margin: 0 auto\">\n      <span style=\"width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.14); display: inline-grid; place-items: center; font-size: 27px; margin-bottom: 16px\">🔧<\/span><div style=\"font-size: 12.5px; font-weight: 900; letter-spacing: 2.4px; color: #9CC8EC; text-transform: uppercase\">Nos interventions<\/div>\n      <h1 class=\"bw-h1\" style=\"font-family: 'Playfair Display', serif; font-size: 54px; line-height: 1.06; font-weight: 700; margin: 16px 0 0; letter-spacing: -.8px\">Services<\/h1>\n      <div style=\"width: 84px; height: 2px; background: #2F7DD1; margin: 26px auto 0\"><\/div>\n      <p class=\"bw-lead\" style=\"font-size: 18.5px; line-height: 1.62; color: #C6D7E8; margin: 24px auto 0; max-width: 100%; text-wrap: pretty\">Entretien, dépannage et mise en service d'adoucisseurs, toutes marques.<\/p>\n    <\/div>\n  <\/section>\n  <!-- ===== SERVICES ===== -->\n  <section id=\"services\" style=\"padding: 104px 32px; background: #F6F7F9; border-top: 1px solid #DCEAF6; border-bottom: 1px solid #DCEAF6\">\n    <div style=\"max-width: 1240px; margin: 0 auto\">\n      <div style=\"max-width: 760px; margin: 0 auto; text-align: center\">\n        <div style=\"font-size: 13px; font-weight: 900; letter-spacing: 1.2px; color: #2F7DD1\">NOS PRESTATIONS<\/div>\n        <h2 class=\"bw-h2\" style=\"font-family: 'Playfair Display', serif; font-size: 44px; line-height: 1.1; font-weight: 700; margin: 14px 0 0; letter-spacing: -.6px\">De la première analyse au suivi annuel<\/h2>\n        <p style=\"font-size: 17.5px; line-height: 1.68; color: #45607B; margin: 18px 0 0; text-wrap: pretty\">Un seul interlocuteur, du diagnostic à la maintenance. Chaque intervention se termine par un compte rendu signé, envoyé par e-mail.<\/p>\n      <\/div>\n\n      <div class=\"bw-r2 bw-p5\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 44px; align-items: stretch\">\n        <div style=\"background: #fff; border: 1px solid #DCEAF6; border-radius: 20px; padding: 30px; box-shadow: 0 2px 0 rgba(0,19,49,.03)\" style-hover=\"border: 1px solid #2F7DD1; box-shadow: 0 20px 44px rgba(0,19,49,.12)\">\n          <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #DCEBFA; color: #14265C; display: grid; place-items: center; font-size: 22px\">📋<\/span>\n          <h3 style=\"font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin: 18px 0 0\">Entretien annuel<\/h3>\n          <p style=\"font-size: 15px; line-height: 1.65; color: #4E687F; margin: 10px 0 0\">La visite qui évite la panne : contrôle des 12 points, désinfection du bac, vérification de la vanne, du bac à sel et des réglages de régénération.<\/p>\n          <ul style=\"margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; font-size: 14.5px; color: #14265C; font-weight: 600\">\n            <li>✓ Analyse dureté entrée / sortie<\/li>\n            <li>✓ Désinfection et détartrage<\/li>\n            <li>✓ Compte rendu signé par e-mail<\/li>\n          <\/ul>\n        <\/div>\n        <div style=\"background: #fff; border: 1px solid #DCEAF6; border-radius: 20px; padding: 30px\" style-hover=\"border: 1px solid #2F7DD1; box-shadow: 0 20px 44px rgba(0,19,49,.12)\">\n          <span style=\"width: 48px; height: 48px; border-radius: 50%; background: #FBF1DD; color: #14265C; display: grid; place-items: center; font-size: 22px\">⚡<\/span>\n          <h3 style=\"font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin: 18px 0 0\">Dépannage rapide<\/h3>\n          <p style=\"font-size: 15px; line-h zvous\" style=\"padding: 104px 32px; background: #F6F7F9\">\n    <div style=\"max-width: 1240px; margin: 0 auto\">\n      <div style=\"text-align: center; max-width: 740px; margin: 0 auto\">\n        <div style=\"font-size: 13px; font-weight: 900; letter-spacing: 1.2px; color: #2F7DD1\">RENDEZ-VOUS EN LIGNE<\/div>\n        <h2 class=\"bw-h2\" style=\"font-family: 'Playfair Display', serif; font-size: 46px; line-height: 1.08; font-weight: 700; margin: 14px 0 0; letter-spacing: -.7px\">Choisissez votre créneau<\/h2>\n        <p style=\"font-size: 17.5px; line-height: 1.68; color: #45607B; margin: 18px 0 0; text-wrap: pretty\">Les horaires affichés sont mes disponibilités réelles : mon agenda se met à jour en direct,<br>un créneau pris disparaît aussitôt.<\/p>\n        <span style=\"display: inline-flex; align-items: center; gap: 9px; margin-top: 20px; background: #EDF6FE; border: 1px solid #9CC8EC; color: #14265C; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 700; letter-spacing: .3px\">💧 Spécialiste adoucisseur d'eau · {{ zone }}<\/span>\n      <\/div>\n\n      <div class=\"bw-r1 bw-p3\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 26px; margin-top: 46px; align-items: stretch\">\n\n        <div style=\"min-width: 0; background: #F4F9FD; border: 1px solid #DCEAF6; border-radius: 24px; padding: 32px\" class=\"bw-pad\">\n          <div style=\"font-size: 12.5px; font-weight: 800; letter-spacing: 1.2px; color: #2F7DD1\">ÉTAPE 1 · TYPE D'INTERVENTION<\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px\">\n            <sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"{{ t.style }}\" sc-camel-on-click=\"{{ t.onClick }}\">\n                <div style=\"display: flex; align-items: center; gap: 10px\">\n                  <span style=\"font-size: 19px\">{{ t.icone }}<\/span>\n or: #C6D7E8; word-break: break-all\" style-hover=\"color: #fff\">{{ email }}<\/a>\n            <span style=\"color: #C6D7E8\">{{ zone }}<\/span>\n            <a sc-camel-on-click=\"{{ versRdv }}\" style=\"color: #9CC8EC; font-weight: 700\" style-hover=\"color: #fff\">Prendre rendez-vous →<\/a>\n            <a href=\"https://shop.bluewavea.fr/\" target=\"_blank\" rel=\"noopener\" style=\"color: #9CC8EC; font-weight: 700\" style-hover=\"color: #fff\">BlueWavea Shop →<\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"margin-top: 44px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.12); display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: #7E97B2\">\n        <span>© 2026 BlueWavea · bluewavea.fr<\/span>\n        <span style=\"margin-left: auto\">Mentions légales · Conditions générales · Données personnelles<\/span>\n      <\/div>\n    <\/div>\n  <\/footer>\n\n  <sc-if value=\"{{ defile }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ hautDePage }}\" aria-label=\"Remonter en haut de la page\" title=\"Remonter en haut\" style=\"position: fixed; right: 26px; bottom: 26px; z-index: 60; width: 52px; height: 52px; border-radius: 50%; border: 1px solid #9CC8EC; background: #2F7DD1; color: #fff; font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 12px 30px rgba(0,19,49,.28); display: flex; align-items: center; justify-content: center; font-family: inherit\" style-hover=\"background: #14265C; border: 1px solid #14265C\">↑<\/button>\n  <\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;telephone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;06 50 37 89 30&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Coordonnées&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;contact@bluewavea.fr&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Coordonnées&quot;},&quot;zone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lyon et ses alentours&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Coordonnées&quot;},&quot;lienSel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Espace client — liens d'achat&quot;},&quot;lienCartouche&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Espace client — liens d'achat&quot;},&quot;lienIoclean&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Espace client — liens d'achat&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    page: 'accueil',\n    type: 'entretien', jourKey: null, creneau: null, moisOffset: 0,\n    civilite: 'Monsieur', nom: '', prenom: '', tel: '', email: '', adresse: '', cp: '', ville: '', message: '', envoye: false,\n    modele: '', serie: '', miseService: '',\n    cCiv: 'Monsieur', cNom: '', cPrenom: '', cTel: '', cEmail: '', cAdresse: '', cCp: '', cVille: '', cSujet: 'Demande de renseignements', cMsg: '', cEnvoye: false,\n    cModele: '', cSerie: '', cMiseService: '',\n    defile: false,\n    occup: null, agendaErreur: false,\n    rdvEnvoi: false, rdvErreur: '', rdvMailKo: false,\n    cEnvoi: false, cErreur: '', cMailKo: false,\n    ecEtape: 'email', ecEmail: '', ecCode: '', ecToken: null, ecDonnees: null, ecCharge: false, ecEnvoi: false, ecErreur: '',\n    ecIdx: 0, ecOnglet: 'accueil', ecDocsOnglet: 'factures', ecDocsPage: {}, ecOuvert: {}, ecAjout: false, ecSerie: '', ecPhoto: null, ecDoc: null,\n    ecCmd: null, ecCmdQte: '1', ecCmdMsg: '', ecCmdOk: false,\n    ecMdp: '', ecMdp2: '', ecCode2: '', ecOubli: false, ecTicket: null, ecA2fMode: '', ecTotpReset: false,\n    ecSec: null, ecPrep: null, ecSecCode: '', ecSecMdp: '', ecSecOk: ''\n  };\n\n  SUPA_URL = 'https://tmxkgxehlvrzjrbxqrpl.supabase.co';\n  SUPA_KEY = 'sb_publishable_2igJPclD1o50Y-r8uI5Ebw_JMEvAlk-';\n  TRAJET = 30;\n  DUREES = { entretien: 60, repar: 90, mes: 90 };\n\n  _env() { return /\\.dc\\.html$/i.test(location.pathname || '') ? 'test' : 'prod'; }\n\n  /* Appel du service BlueWavea. Le site ne touche jamais directement à la base\n     ni à la messagerie : le serveur vérifie le créneau, écrit le rendez-vous\n     et envoie le courrier lui-même. */\n  _service(action, donnees) {\n    return fetch(this.SUPA_URL + '/functions/v1/bluewavea-site', {\n      method: 'POST',\n      headers: { apikey: this.SUPA_KEY, authorization: 'Bearer ' + this.SUPA_KEY, 'content-type': 'application/json' },\n      body: JSON.stringify(Object.assign({ action: action, env: this._env() }, donnees || {}))\n    })\n      .then(r => r.json().catch(() => null))\n      .then(d => (d && d.ok) ? d : Promise.reject((d && d.erreur) || 'service indisponible'));\n  }\n\n  /* Disponibilités réelles de l'agenda : le serveur ne renvoie que des plages\n     horaires occupées, aucune donnée de client. */\n  _chargerAgenda() {\n    this._service('site-dispos')\n      .then(d => this.setState({ occup: d.occup || {}, agendaErreur: false }))\n      .catch(() => this.setState({ occup: null, agendaErreur: true }));\n  }\n\n  /* ===== NOTICES DES APPAREILS : liste publique + téléchargement du PDF (via bluewavea-site) ===== */\n  _ntCharger() {\n    if (this.state.ntListeBrute) return;\n    this.setState({ ntEnCours: true });\n    /* secours : si la fonction serveur n'est pas encore à jour, lecture directe de la liste (liens publics uniquement) */\n    const direct = () => fetch(this.SUPA_URL + '/rest/v1/reglages?id=eq.notices&select=data', { headers: { apikey: this.SUPA_KEY, authorization: 'Bearer ' + this.SUPA_KEY } })\n      .then(x => x.json()).then(rows => {\n        const l = ((rows && rows[0] && rows[0].data && rows[0].data.liste) || []).filter(n => n && !n.supprimeLe)\n var vus=[];

function suivre(doc){ if(!doc||!doc.body) return; var W=doc.defaultView||window;
  if(doc.__bwBody===doc.body&&vus.indexOf(doc)>=0) return;
